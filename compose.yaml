services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: platform
      POSTGRES_USER: platform
      POSTGRES_PASSWORD: local-development-only
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U platform"]
      interval: 5s
      retries: 10
  api:
    build: ./app/api
    environment:
      DB_HOST: db
      DB_USER: platform
      DB_NAME: platform
      DB_PASSWORD: local-development-only
      DB_SSLMODE: disable
    depends_on:
      db: {condition: service_healthy}
  web:
    build: ./app/web
  gateway:
    image: nginxinc/nginx-unprivileged:1.28-alpine
    ports: ["8080:8080"]
    volumes: ["./local/gateway.conf:/etc/nginx/conf.d/default.conf:ro"]
    depends_on: [web, api]
volumes:
  postgres-data:
