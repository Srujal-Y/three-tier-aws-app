<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Three Tier | Platform Board</title>
<style>:root{font:17px system-ui;color:#e4edf8;background:#0b1220}body{max-width:850px;margin:8vh auto;padding:24px}small{color:#6ee7b7;letter-spacing:2px}h1{font-size:clamp(36px,7vw,64px);margin:20px 0}p{color:#a9bad0}form,li{display:flex;gap:12px;padding:18px;background:#162238;border-radius:12px;margin:12px 0}input[type=text]{flex:1;min-width:0;background:#0b1220;color:white;border:1px solid #516078;border-radius:6px;padding:12px}button{border:0;border-radius:6px;padding:10px 18px;background:#6ee7b7;cursor:pointer}ul{padding:0;list-style:none}li span{flex:1;overflow-wrap:anywhere}li.done span{text-decoration:line-through;color:#91a0b5}footer{margin-top:40px;color:#91a0b5}#status{min-height:24px}</style>
<small>AWS / ECS FARGATE / POSTGRESQL</small><h1>Platform Board</h1><p>A working three-tier application. Create a task, track progress, and persist it across deployments.</p>
<form id="form"><input id="title" type="text" maxlength="200" required aria-label="New task" placeholder="What are we building next?"><button>Add task</button></form>
<p id="status" role="status"></p><ul id="tasks"></ul><footer>Web tier ? API tier ? Database tier • Multi-AZ infrastructure</footer>
<script>
const status=document.querySelector('#status');
async function api(path='',options={}){const r=await fetch('/api/tasks'+path,{...options,headers:{'Content-Type':'application/json'}});if(!r.ok)throw new Error('Request failed. Please try again.');return r.status===204?null:r.json()}
async function load(){try{const tasks=await api();document.querySelector('#tasks').replaceChildren(...tasks.map(t=>{const li=document.createElement('li');li.className=t.done?'done':'';const check=document.createElement('input');check.type='checkbox';check.checked=t.done;check.setAttribute('aria-label','Complete '+t.title);check.onchange=()=>change('/'+t.id,{method:'PATCH',body:JSON.stringify({done:check.checked})});const title=document.createElement('span');title.textContent=t.title;const del=document.createElement('button');del.textContent='Delete';del.onclick=()=>change('/'+t.id,{method:'DELETE'});li.append(check,title,del);return li}));status.textContent=tasks.length?`${tasks.length} recent tasks`:'No tasks yet. Add your first one.'}catch(e){status.textContent=e.message}}
async function change(path,options){try{await api(path,options);await load()}catch(e){status.textContent=e.message}}
document.querySelector('#form').onsubmit=async e=>{e.preventDefault();const input=document.querySelector('#title');try{await api('',{method:'POST',body:JSON.stringify({title:input.value})});input.value='';await load()}catch(e){status.textContent=e.message}};load();
</script></html>
